prefix: "&bdenemeac &8|"

alerts-enabled: "%prefix% &fAlerts abilitati"
alerts-disabled: "%prefix% &fAlerts disabilitati"
verbose-enabled: "%prefix% &fVerbose enabled"
verbose-disabled: "%prefix% &fVerbose disabled"
brands-enabled: "%prefix% &fBrands enabled"
brands-disabled: "%prefix% &fBrands disabled"
client-brand-format: "%prefix% &f%player% si è connesso usando %brand%"
console-specify-target: "%prefix% &cDevi specificare un destinatario come console!"
reloading: "%prefix% &7Reloading config..."
reloaded: "%prefix% &fConfig has been reloaded."
reload-failed: "%prefix% &cFailed to reload config."
player-not-found: "%prefix% &cIl giocatore è esente o offline!"
player-not-this-server: "%prefix% &cIl giocatore non è in questo server!"
sender-not-found: "%prefix% &cNon puoi usare questo comando se sei esente!"
spectate-return: "<click:run_command:/denemeac stopspectating><hover:show_text:\"/denemeac stopspectating\">\n%prefix% &fClicca qui per tornare alla posizione precedente\n</hover></click>"
cannot-spectate-return: "%prefix% &cPuoi farlo solo dopo aver osservato un giocatore"
cannot-run-on-self: "%prefix% &cNon puoi usare questo comando su te stesso!"
upload-log: "%prefix% &fDebug caricato su: %url%"
upload-log-start: "%prefix% &fCaricamento del registro... attendere prego"
upload-log-not-found: "%prefix% &cImpossibile trovare quel registro"
upload-log-upload-failure: "%prefix% &cQualcosa è andato storto durante il caricamento di questo registro, vedi la console per ulteriori informazioni"
disconnect:
    timeout: "<lang:disconnect.timeout>"
    closed: "<lang:disconnect.closed>"
    error: "<red>An error occurred whilst processing packets. Please contact the administrators."
    blacklisted-forge: "<red>Your forge version is blacklisted due to inbuilt reach hacks.<newline><gold>Versions affected: 1.18.2-1.19.3<newline><newline><red>Please see https://github.com/MinecraftForge/MinecraftForge/issues/9309."
run-as-player: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori!"
run-as-player-or-console: "%prefix% &cQuesto comando può essere utilizzato solo dai giocatori o dalla console!"
webhook-not-enabled: "Discord webhooks are not enabled!"
webhook-test-message: "test message"
webhook-test-succeeded: "Discord webhook test succeeded!"
webhook-test-failed: "Discord webhook test failed!"

alerts-format: "%prefix% &f[&b%player%&f] &f%category% &7detected &8(&b%check_name%&8)"
alerts-format-proxy: "%prefix% &f[&cproxy&f] &f[&b%player%&f] &f%category% &7detected &8(&b%check_name%&8)"
experimental-symbol: "*"

profile:
    - "&7======================"
    - "%prefix% &bProfilo per &f%player%"
    - "&bPing: &f%ping%"
    - "&bVersione: &f%version%"
    - "&bBrand del Client: &f%brand%"
    - "&bSensibilità Orizzontale: &f%h_sensitivity%%"
    - "&bSensibilità Verticale: &f%v_sensitivity%%"
    - "&bFastMath Abilitato: &f%fast_math%"
    - "&7======================"
help:
    - "&7======================"
    - "/denemeac alerts &f- &7Attiva/disattiva gli alerts"
    - "/denemeac brands &f- &7Toggle brands"
    - "/denemeac profile <giocatore> &f- &7Visualizza le informazioni del giocatore"
    - "/denemeac help &f- &7Visualizza questo messaggio di aiuto"
    - "/denemeac debug <giocatore> &f- &7Output di previsione dello sviluppatore"
    - "/denemeac perf &f- &7Ms/predizione dello sviluppatore"
    - "/denemeac reload &f- &7Ricarica la configurazione"
    - "/denemeac spectate <giocatore> &f- &7Osserva un giocatore"
    - "/denemeac verbose &f- &7Mostra ogni segnalazione a te, senza buffer"
    - "/denemeac log [0-255] &f- &7Carica un registro di debug per le segnalazioni di previsione"
    - "/denemeac history <player> &f- &7Lista delle sessioni (più recenti prima)"
    - "/denemeac history <player> page <N> &f- &7Salta alla pagina N della lista delle sessioni"
    - "/denemeac history <player> session <N|latest> [-d] [-v] &f- &7Dettaglio della sessione (violazioni più recenti prima)"
    - "/denemeac history <player> session <N|latest> page <N> [-d] [-v] &f- &7Dettaglio della sessione, pagina N delle violazioni"
    - "&7======================"

# === /denemeac history ===
# UI cronologia basata sulle sessioni. Tutte le righe sotto sono template
# MiniMessage configurabili. Gli hover predefiniti sono nei tag inline
# <hover:show_text:'...'> e nelle chiavi frammento hover qui sotto; rimuovi
# l'hover inline per usare il fallback del renderer.

deneme-history-load-failure: "%prefix% &cImpossibile caricare il sottosistema della cronologia! Controlla la console del server per errori."
deneme-history-disabled: "%prefix% &cIl sottosistema cronologia è disabilitato!"
deneme-history-failed: "%prefix% &cCaricamento cronologia fallito: &7%error%"
deneme-history-unknown-player: "%prefix% &cGiocatore sconosciuto: &f%player%"
deneme-history-no-sessions: "%prefix% &7Nessuna cronologia di sessioni per &f%player%&7."
deneme-history-session-not-found: "%prefix% &cSessione &f%ordinal%&c non trovata per &f%player%&c."

# Lista sessioni — placeholder validi: %prefix% %player% %page% %max_pages%
deneme-history-header: "%prefix% &bMostrando cronologia sessioni per &f%player% &8[&f%page%&7/&f%max_pages%&8]"
# Riga di riepilogo singola sessione — placeholder validi:
#   %prefix% %player% %ordinal% %deneme_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %crashed_marker% %session_uuid% %detail_command%
# %crashed_marker% si espande in deneme-history-crashed-marker per sessioni la
# cui connessione è caduta senza chiusura pulita (crash del server, kill -9,
# RST del canale che non ha attivato UserDisconnectEvent). Stringa vuota per
# sessioni in corso o chiuse correttamente.
deneme-history-session: "<hover:show_text:'&bSessione &7%session_uuid%<newline>&7Clicca o esegui &e%detail_command%<newline>&7per vedere i dettagli della sessione.'>%prefix% &8[&b%deneme_version%&8] &8[&b%server_name%&8] &8[&b%client_version%&8] &bSessione &f%ordinal%&b, durata &f%duration%&b, con &c%violations%&b violazioni &8[&c%unique_checks%&8]%crashed_marker% &8(&7%timeago% fa&8)</hover>"

# Marcatore inline sostituito in %crashed_marker% per sessioni il cui
# closed_at == last_activity (cioè marcate dallo sweep di crash al successivo
# avvio, non dal percorso di disconnessione). Include uno spazio iniziale
# perché il marcatore si legga naturalmente quando presente e scompaia
# pulito quando vuoto.
deneme-history-crashed-marker: " &8(&ccrash&8)"

# Dettaglio sessione — placeholder validi:
#   %prefix% %player% %ordinal% %deneme_version% %server_name%
#   %client_version% %client_brand% %duration% %timeago%
#   %violations% %unique_checks% %bucket_size%
deneme-history-detail-header: "%prefix% &bDettaglio sessione &f%ordinal% &bdi &f%player%&b:"
deneme-history-detail-meta1: "%prefix% &bDeneme: &f%deneme_version%&b, Server: &f%server_name%&b, Durata: &f%duration%&b, Data: &7%timeago% fa"
deneme-history-detail-meta2: "%prefix% &bClient: &f%client_version%&b, Marca: &f%client_brand%"
deneme-history-detail-violations-header: "%prefix% &bViolazioni: &8(%violations% totali, %unique_checks% uniche)"
deneme-history-detail-empty: "%prefix% &7- (nessuna)"
# Riga raggruppata (predefinito) — placeholder validi: %prefix% %offset% %checks_list%
#   %bucket_start% %bucket_end% %bucket_hover_entries%
#   %checks_list% è costruita unendo voci deneme-history-check-count con ", "
deneme-history-detail-group: "<hover:show_text:'&bViolazioni in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%'>%prefix% &7- %checks_list% &8(&b%offset%&8)</hover>"
deneme-history-detail-group-hover: "&bViolazioni in &f%bucket_start%–%bucket_end%&b:%bucket_hover_entries%"
deneme-history-detail-group-hover-entry: "<newline>&8  %offset% &b%check%%description%%verbose%"
deneme-history-hover-description: " — &f%description%"
deneme-history-detail-group-hover-verbose: " — &7%verbose%"
# Riga di violazione singola (--detailed) — placeholder validi:
#   %prefix% %offset% %check% %description% %vl% %verbose%
deneme-history-detail-entry: "%prefix% &7- &f%check% &8(&b%offset%&8)&7 %verbose%"
deneme-history-detail-entry-hover: "&b%check%%description%<newline>&8@ %offset% — vl %vl%%verbose%"
deneme-history-detail-entry-hover-verbose: "<newline>&7%verbose%"
# Formato interno per ogni check in %checks_list% — placeholder validi: %check_name% %count%
deneme-history-check-count: "&f%check_name%&7 x&c%count%"

# Marcatori di schema — vedi il commento di intestazione in config.yml.
config-flavor: V2
config-version: 2
